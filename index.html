<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Servicios de Trabajadores</title>
</head>

<body>
    <header>
        <h1>Encuentra a tu Trabajador Ideal</h1>
    </header>

    <main>
        <section id="trabajadores">
            <h2>Trabajadores Disponibles</h2>
            <div id="lista-trabajadores"></div>
        </section>

        <section id="solicitud">
            <h2>Solicitar Servicio</h2>
            <form id="form-solicitud">
                <label for="trabajador">Seleccionar Trabajador:</label>
                <select id="trabajador" name="trabajador"></select>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora" required>
                <button type="submit">Solicitar Visita</button>
            </form>
        </section>
    </main>

    <footer>
        <p> 2025 Servicios de Trabajadores</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
